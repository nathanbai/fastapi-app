name: Deploy FastAPI

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: fastapi-repo
  SERVICE: fastapi-service

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: |
        gcloud auth configure-docker \
        us-central1-docker.pkg.dev

    - name: Build Docker Image
      run: |
        docker build \
        -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${{ github.sha }} \
        .

    - name: Push Docker Image
      run: |
        docker push \
        us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${{ github.sha }}

    - name: Deploy Cloud Run
      run: |
        gcloud run deploy $SERVICE \
        --image=us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${{ github.sha }} \
        --platform=managed \
        --region=$REGION \
        --allow-unauthenticated